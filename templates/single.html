<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Certificate — Certificate Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa; --surface: #fff; --surface-alt: #f4f5f7;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --text-secondary: #64748b; --text-muted: #94a3b8;
  --accent: #b45309; --accent-hover: #92400e; --accent-light: #fef3c7;
  --danger: #dc2626; --success: #16a34a;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
  --radius: 10px; --radius-lg: 16px;
}
[data-theme=dark] {
  --bg: #0c0e14; --surface: #161923; --surface-alt: #1e2130;
  --border: #2a2e3d; --border-strong: #3a3f52;
  --text: #e8ecf4; --text-secondary: #94a3b8; --text-muted: #64748b;
  --accent: #f59e0b; --accent-hover: #fbbf24; --accent-light: rgba(245,158,11,.1);
  --danger: #f87171; --success: #4ade80;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 4px 6px -1px rgba(0,0,0,.4), 0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.5), 0 4px 6px -4px rgba(0,0,0,.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; }

.header { background:var(--surface); border-bottom:1px solid var(--border); padding:.7rem 1.5rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
.header h1 { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
.header-left { display:flex; align-items:center; gap:1rem; }
.header a { color:var(--text-secondary); text-decoration:none; font-size:.82rem; font-weight:500; padding:.45rem .8rem; border-radius:6px; transition:all .15s; border:1px solid var(--border); }
.header a:hover { color:var(--text); background:var(--surface-alt); border-color:var(--border-strong); }
.theme-toggle { width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; color:var(--text-secondary); }
.theme-toggle:hover { background:var(--surface-alt); color:var(--text); }
.theme-toggle svg { width:16px; height:16px; }
.sun-icon { display:none; } .moon-icon { display:block; }
[data-theme=dark] .sun-icon { display:block; } [data-theme=dark] .moon-icon { display:none; }

.layout { display:flex; height:calc(100vh - 50px); }
.sidebar { width:340px; background:var(--surface); padding:1.5rem; overflow-y:auto; border-right:1px solid var(--border); }
.sidebar h2 { font-size:.78rem; font-weight:600; margin-bottom:1rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:.75rem; color:var(--text-muted); margin-bottom:.3rem; font-weight:500; text-transform:uppercase; letter-spacing:.04em; }
.form-group input { width:100%; padding:.6rem .75rem; border:1px solid var(--border); border-radius:8px; font-size:.9rem; background:var(--bg); color:var(--text); transition:all .15s; }
.form-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.form-group input::placeholder { color:var(--text-muted); }
.btn { display:block; width:100%; padding:.7rem; border:none; border-radius:8px; font-size:.85rem; cursor:pointer; font-weight:600; text-decoration:none; text-transform:uppercase; letter-spacing:.03em; transition:all .15s; text-align:center; }
.btn-primary { background:var(--text); color:var(--bg); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
.preview-area { flex:1; display:flex; align-items:center; justify-content:center; padding:1.5rem; background:var(--bg); }
.placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); border:2px dashed var(--border); border-radius:var(--radius-lg); padding:3rem; background:var(--surface); min-width:320px; min-height:240px; }
.placeholder-icon { font-size:2.5rem; margin-bottom:.75rem; color:var(--accent); opacity:.5; }
.placeholder p { font-size:.9rem; font-weight:500; }
iframe { width:90%; height:90%; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Single Certificate</h1>
    <a href="/">← Back</a>
  </div>
  <button onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle dark mode">
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>
<div class="layout">
  <div class="sidebar">
    <h2>Participant Details</h2>
    <form id="cert-form">
      <button type="submit" class="btn btn-primary">Generate &amp; Download →</button>
    </form>
  </div>
  <div class="preview-area" id="preview-area">
    <div class="placeholder">
      <div class="placeholder-icon">📄</div>
      <p>Certificate preview will appear here</p>
    </div>
  </div>
</div>
<script>
let config={};
async function loadConfig(){try{const r=await fetch("/api/config");if(r.ok){config=await r.json();populateForm()}}catch(e){console.warn("Could not load config:",e)}}
function populateForm(){const form=document.getElementById("cert-form");const existing=form.querySelectorAll('.form-group');existing.forEach(el=>el.remove());const btn=form.querySelector('button[type="submit"]');(config.custom_fields||[]).forEach(f=>{const d=document.createElement("div");d.className="form-group";d.innerHTML='<label for="field-'+f.key+'">'+(f.label||f.key)+'</label><input type="text" id="field-'+f.key+'" data-key="'+f.key+'" placeholder="'+(f.sample_text||'')+'" '+(f.required?'required':'')+'>';form.insertBefore(d,btn)})}
document.getElementById("cert-form").addEventListener("submit",async e=>{e.preventDefault();const fields={};document.querySelectorAll('.form-group input').forEach(i=>{if(i.dataset.key)fields[i.dataset.key]=i.value});if(!fields.name){alert("Name is required!");return}
const a=document.getElementById("preview-area");a.innerHTML='<div class="placeholder"><div class="placeholder-icon">⏳</div><p>Generating...</p></div>';const r=await fetch("/api/generate-single",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});if(r.ok){const b=await r.blob(),u=URL.createObjectURL(b);a.innerHTML="";const f=document.createElement("iframe");f.src=u;a.appendChild(f);const d=document.createElement("a");d.href=u;d.download=fields.name.replace(/\s+/g,"_")+"_certificate.pdf";document.body.appendChild(d);d.click();document.body.removeChild(d)}else{const e=await r.json();a.innerHTML='<div class="placeholder"><div class="placeholder-icon">✕</div><p>Error: '+e.error+'</p></div>'}})
function toggleTheme(){var d=document.documentElement;var t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);localStorage.setItem('theme',t)}
var saved=localStorage.getItem('theme');if(saved){document.documentElement.setAttribute('data-theme',saved)}else if(window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark')}
window.addEventListener("DOMContentLoaded",loadConfig)
</script>
</body>
</html>
