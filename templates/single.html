<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Certificate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0ece3; }
        .header {
            background: #8b6914; color: #fff; padding: 0.8rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { font-size: 1.2rem; }
        .header a { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.8; }
        .header a:hover { opacity: 1; }
        .layout { display: flex; height: calc(100vh - 48px); }

        .sidebar {
            width: 300px; background: #fff; padding: 1.5rem;
            overflow-y: auto; border-right: 1px solid #ddd;
        }
        .sidebar h2 { font-size: 0.95rem; color: #8b6914; margin-bottom: 1rem; padding-bottom: 0.4rem; border-bottom: 2px solid #c9a227; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; color: #5a4a2e; margin-bottom: 0.3rem; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 0.5rem 0.7rem; border: 1px solid #ccc;
            border-radius: 5px; font-size: 0.9rem;
        }
        .btn {
            display: inline-block; padding: 0.6rem 1.2rem; border: none;
            border-radius: 5px; font-size: 0.85rem; cursor: pointer;
            text-decoration: none; font-weight: 600; width: 100%;
        }
        .btn-primary { background: #8b6914; color: #fff; }
        .btn-primary:hover { background: #6d5210; }

        .preview-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 1rem; background: #e8e3d8;
        }
        iframe {
            width: 90%; height: 90%; border: 2px solid #c9a227;
            border-radius: 8px; background: #fff;
        }
        .placeholder {
            width: 90%; height: 90%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #8b6914;
        }
        .placeholder p { font-size: 1rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Single Certificate Generator</h1>
        <a href="/">Back to Dashboard</a>
    </div>

    <div class="layout">
        <div class="sidebar">
            <h2>Participant Details</h2>
            <form id="cert-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Sreerag S Nair">
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" required placeholder="CSE">
                </div>
                <div class="form-group">
                    <label for="year">Year of Study</label>
                    <input type="text" id="year" required placeholder="4th Year">
                </div>
                <button type="submit" class="btn btn-primary">Generate Certificate</button>
            </form>
        </div>

        <div class="preview-area" id="preview-area">
            <div class="placeholder">
                <div style="font-size: 3rem;">&#x1F4C4;</div>
                <p>Certificate preview will appear here</p>
            </div>
        </div>
    </div>

    <script>
        let config = {};

        async function loadConfig() {
            try {
                const res = await fetch("/api/config");
                if (res.ok) {
                    config = await res.json();
                    populateForm();
                }
            } catch(e) {
                console.warn("Could not load config:", e);
            }
        }

        function populateForm() {
            const form = document.getElementById("cert-form");
            // Clear existing extra inputs
            const existingExtras = form.querySelectorAll('.extra-input');
            existingExtras.forEach(el => el.remove());

            // Add inputs for extra texts
            if (config.extra_texts && config.extra_texts.length > 0) {
                config.extra_texts.forEach((extra, index) => {
                    const div = document.createElement("div");
                    div.className = "form-group extra-input";
                    div.innerHTML = `
                        <label for="extra-text-${index}">Extra Text ${index + 1}</label>
                        <input type="text" id="extra-text-${index}" placeholder="${extra.sample_text || ''}">
                    `;
                    form.insertBefore(div, form.lastElementChild);
                });
            }
        }

        document.getElementById("cert-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById("name").value,
                department: document.getElementById("department").value,
                year: document.getElementById("year").value,
            };

            // Add extra text values
            if (config.extra_texts) {
                data.extra_texts = config.extra_texts.map((extra, index) => {
                    const input = document.getElementById(`extra-text-${index}`);
                    return input ? input.value : extra.sample_text;
                });
            }

            const area = document.getElementById("preview-area");
            area.innerHTML = '<div class="placeholder"><p>Generating...</p></div>';

            const res = await fetch("/api/generate-single", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });

            if (res.ok) {
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                area.innerHTML = "";
                const iframe = document.createElement("iframe");
                iframe.src = url;
                area.appendChild(iframe);

                // Auto-download
                const a = document.createElement("a");
                a.href = url;
                a.download = `${data.name.replace(/\s+/g, "_")}_certificate.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                const err = await res.json();
                area.innerHTML = `<div class="placeholder"><p>Error: ${err.error}</p></div>`;
            }
        });

        window.addEventListener("DOMContentLoaded", loadConfig);
    </script>
</body>
</html>
