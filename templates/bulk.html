<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Certificate Generation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0ece3; }
        .header {
            background: #8b6914; color: #fff; padding: 0.8rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { font-size: 1.2rem; }
        .header a { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.8; }
        .header a:hover { opacity: 1; }
        .layout { display: flex; height: calc(100vh - 48px); }

        .sidebar {
            width: 340px; background: #fff; padding: 1.2rem;
            overflow-y: auto; border-right: 1px solid #ddd;
        }
        .sidebar h2 { font-size: 0.95rem; color: #8b6914; margin-bottom: 0.8rem; padding-bottom: 0.4rem; border-bottom: 2px solid #c9a227; }
        textarea {
            width: 100%; height: 250px; font-family: monospace; font-size: 0.8rem;
            padding: 0.5rem; border: 1px solid #ccc; border-radius: 5px;
            resize: vertical;
        }
        .btn-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .btn {
            flex: 1; padding: 0.6rem 1rem; border: none; border-radius: 5px;
            font-size: 0.85rem; cursor: pointer; font-weight: 600; text-align: center;
        }
        .btn-primary { background: #8b6914; color: #fff; }
        .btn-primary:hover { background: #6d5210; }
        .btn-secondary { background: #c9a227; color: #fff; }
        .btn-secondary:hover { background: #b8911f; }
        .file-row { margin-top: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
        .file-row label { font-size: 0.8rem; color: #5a4a2e; font-weight: 600; }
        .file-row input { font-size: 0.8rem; }

        .info { font-size: 0.78rem; color: #6b5a3e; margin-top: 0.5rem; line-height: 1.4; }

        .table-area {
            flex: 1; padding: 1.2rem; overflow: auto;
        }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th { background: #8b6914; color: #fff; font-size: 0.8rem; text-align: left; padding: 0.6rem 1rem; }
        td { padding: 0.5rem 1rem; font-size: 0.82rem; border-bottom: 1px solid #eee; }
        tr:nth-child(even) { background: #f8f6ef; }
        tr:hover { background: #f0ece3; }
        #count { font-size: 0.85rem; color: #6b5a3e; margin-bottom: 0.5rem; }
        #status { font-size: 0.85rem; color: #2d7a2d; margin-top: 0.5rem; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bulk Certificate Generation</h1>
        <a href="/">Back to Dashboard</a>
    </div>

    <div class="layout">
        <div class="sidebar">
            <h2>CSV Data</h2>
            <textarea id="csv-data"></textarea>
            <p class="info">First column must be <b>Name</b>. Other columns should match configured extra text fields. Customize in the Editor.</p>

            <div class="file-row">
                <label>Or upload file:</label>
                <input type="file" id="csv-file" accept=".csv">
            </div>

            <div class="btn-row">
                <button class="btn btn-secondary" id="load-btn">Load CSV</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="generate-btn">Generate All</button>
            </div>

            <div id="status"></div>
        </div>

        <div class="table-area">
            <div id="count"></div>
            <table id="table">
                <thead>
                    <tr id="header-row"><th>#</th></tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let config = {};
        let csvData = [];
        let headers = [];

        async function loadConfig() {
            try {
                const res = await fetch("/api/config");
                if (res.ok) {
                    config = await res.json();
                    generateCSVTemplate();
                }
            } catch(e) {
                console.warn("Could not load config:", e);
            }
        }

        function generateCSVTemplate() {
            const mainFields = config.custom_fields || [];
            const extraTexts = config.extra_texts || [];
            
            const cols = mainFields.map(f => f.key);
            extraTexts.forEach((text, idx) => {
                cols.push(`extra_text_${idx + 1}`);
            });
            
            const header = cols.join(",");
            const example = cols.map(col => {
                if (col === "name") return "Example Person";
                if (col === "organization") return "Example Org";
                if (col === "role") return "Example Role";
                return "Extra Text";
            }).join(",");
            
            document.getElementById("csv-data").value = header + "\n" + example;
        }

        function parseCSV(text) {
            const lines = text.trim().split("\n");
            if (lines.length === 0) return [];
            
            headers = lines[0].split(",").map(h => h.trim());
            const rows = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const values = line.split(",").map(v => v.trim());
                const row = {};
                headers.forEach((h, idx) => {
                    row[h] = values[idx] || "";
                });
                rows.push(row);
            }
            
            return rows;
        }

        function displayTable() {
            const headerRow = document.getElementById("header-row");
            headerRow.innerHTML = "<th>#</th>";
            
            headers.forEach(h => {
                const th = document.createElement("th");
                th.textContent = h.replace(/_/g, " ");
                headerRow.appendChild(th);
            });
            
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            
            csvData.forEach((row, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${idx + 1}</td>`;
                headers.forEach(h => {
                    const td = document.createElement("td");
                    td.textContent = row[h] || "";
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            document.getElementById("count").textContent = `${csvData.length} record(s)`;
        }

        document.getElementById("load-btn").addEventListener("click", async () => {
            const file = document.getElementById("csv-file").files[0];
            if (file) {
                const text = await file.text();
                document.getElementById("csv-data").value = text;
            }
            
            csvData = parseCSV(document.getElementById("csv-data").value);
            displayTable();
        });

        document.getElementById("csv-data").addEventListener("change", () => {
            csvData = parseCSV(document.getElementById("csv-data").value);
            displayTable();
        });

        document.getElementById("generate-btn").addEventListener("click", async () => {
            if (csvData.length === 0) {
                alert("No CSV data loaded!");
                return;
            }
            
            const statusEl = document.getElementById("status");
            statusEl.textContent = "Generating certificates...";
            
            try {
                const res = await fetch("/api/generate-bulk", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ records: csvData })
                });
                
                if (res.ok) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "certificates.zip";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    statusEl.textContent = "✓ Certificates generated and downloaded!";
                } else {
                    const err = await res.json();
                    statusEl.textContent = `Error: ${err.error}`;
                }
            } catch(e) {
                statusEl.textContent = `Error: ${e.message}`;
            }
        });

        window.addEventListener("DOMContentLoaded", loadConfig);
    </script>
</body>
</html>
